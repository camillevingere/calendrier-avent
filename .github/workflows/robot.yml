# Le robot du calendrier : publie la clé des cases dues.
#
# Planifié toutes les 5 minutes (GitHub ne connaît que l'UTC : c'est le script
# qui calcule l'heure de Paris, donc rien ne s'ouvre jamais trop tôt). Un
# passage sauté ou retardé est rattrapé au suivant. Bouton manuel :
# onglet Actions → « Robot du calendrier » → Run workflow.
name: Robot du calendrier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-calendrier
  cancel-in-progress: false

jobs:
  ouvrir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Le robot n'utilise que Node : pas d'installation de dépendances.
      - name: Calcule et publie les cases dues
        id: robot
        env:
          CONTENU_CLE: ${{ secrets.CONTENU_CLE }}
        run: node scripts/robot.ts

      - name: Commite l'état
        if: steps.robot.outputs.change == 'true'
        env:
          MESSAGE: ${{ steps.robot.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat/ouvertes.json
          git commit -m "Robot : $MESSAGE"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
